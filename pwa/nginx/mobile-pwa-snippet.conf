# Add inside server { } for printechs.com / erp.printechs.com in frappe-bench.conf
# BEFORE the catch-all `location /` that proxies to Next.js (port 3000).

	location = /mobile {
		return 301 /mobile/;
	}

	location ^~ /mobile/ {
		alias /home/erpnext/frappe-bench/sites/site1.local/public/mobile/;
		index index.html;
		add_header Cache-Control "no-cache";
	}
